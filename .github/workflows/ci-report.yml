# Informe del CI para la Factory (BL-091).
# La Factory no puede leer los logs de Actions. Este workflow corre la suite en cada push a main
# y deja el resultado en ci/ULTIMO.md con el commit verificado: VERDE con el conteo o FALLA con la salida.
#
# Seguridad: solo en este repo y solo con pushes del dueño; nada del evento entra a un comando;
# el único archivo que commitea es ci/ULTIMO.md (verificado antes del commit).

name: ci-report

on:
  push:
    branches: [main]
    paths-ignore:
      - 'ci/**'

permissions:
  contents: write

concurrency:
  group: ci-report
  cancel-in-progress: false

jobs:
  report:
    if: >-
      github.repository == 'PabloSnchz/gw2-factory-dashboard' &&
      github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Correr la suite
        id: suite
        run: |
          set +e
          node --test --test-reporter=spec tests/*.test.mjs > "$RUNNER_TEMP/out.txt" 2>&1
          echo "code=$?" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Escribir ci/ULTIMO.md
        run: |
          mkdir -p ci
          if [ "${{ steps.suite.outputs.code }}" != "0" ]; then
            {
              echo "# CI: FALLA"
              echo
              echo "- Commit verificado: $(git rev-parse HEAD)"
              echo "- Fecha: $(date -u +%Y-%m-%dT%H:%MZ)"
              echo
              echo "## Fallas"
              echo
              echo '```'
              grep -n -E "✖|not ok|AssertionError|Error:|expected|actual" "$RUNNER_TEMP/out.txt" | head -n 200
              echo '```'
              echo
              echo "## Salida (últimos 60 KB)"
              echo
              echo '```'
              tail -c 60000 "$RUNNER_TEMP/out.txt"
              echo '```'
            } > ci/ULTIMO.md
          else
            {
              echo "# CI: VERDE"
              echo
              echo "- Commit verificado: $(git rev-parse HEAD)"
              echo "- Fecha: $(date -u +%Y-%m-%dT%H:%MZ)"
              echo
              grep -E "^ℹ (tests|pass|fail)" "$RUNNER_TEMP/out.txt"
            } > ci/ULTIMO.md
          fi

      - name: Commit del informe
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- ci/ULTIMO.md
          if git diff --cached --name-only | grep -vx 'ci/ULTIMO.md'; then echo "Cambios no esperados"; exit 1; fi
          git diff --cached --quiet && exit 0
          git commit -m "ci-report: ci/ULTIMO.md"
          git push origin HEAD:main || { git pull --rebase origin main && git push origin HEAD:main; }
